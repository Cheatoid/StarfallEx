<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0a0d12;
  --bg-secondary: #0f1419;
  --bg-tertiary: #1a1f2a;
  --fg-primary: #e8e4d4;
  --fg-secondary: #a0a8b0;
  --fg-muted: #5a6470;
  --accent: #ffb800;
  --accent-soft: rgba(255, 184, 0, 0.12);
  --accent-glow: rgba(255, 184, 0, 0.4);
  --cyan: #00d9ff;
  --cyan-glow: rgba(0, 217, 255, 0.35);
  --red: #ff5c57;
  --green: #5af78e;
  --magenta: #ff77ff;
  --border: rgba(255, 184, 0, 0.18);
  --border-soft: rgba(255, 255, 255, 0.06);
  --glass: rgba(15, 20, 25, 0.7);
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;
  --font-ui: 'Space Grotesk', sans-serif;
  --font-size: 14px;
  --bg-opacity: 0.25;
}

[data-theme="cyberpunk"] {
  --bg-primary: #0d0221; --bg-secondary: #1a0a2e; --bg-tertiary: #2d1b3d;
  --accent: #ff2a6d; --accent-soft: rgba(255, 42, 109, 0.15); --accent-glow: rgba(255, 42, 109, 0.5);
  --cyan: #05d9e8; --cyan-glow: rgba(5, 217, 232, 0.4); --border: rgba(255, 42, 109, 0.25); --fg-primary: #f8e8ff;
}
[data-theme="matrix"] {
  --bg-primary: #000000; --bg-secondary: #050a05; --bg-tertiary: #0a1a0a;
  --accent: #00ff41; --accent-soft: rgba(0, 255, 65, 0.1); --accent-glow: rgba(0, 255, 65, 0.5);
  --cyan: #00ff41; --cyan-glow: rgba(0, 255, 65, 0.4); --border: rgba(0, 255, 65, 0.2); --fg-primary: #c8ffc8;
}
[data-theme="ocean"] {
  --bg-primary: #0a1929; --bg-secondary: #0f2438; --bg-tertiary: #1a3450;
  --accent: #64ffda; --accent-soft: rgba(100, 255, 218, 0.1); --accent-glow: rgba(100, 255, 218, 0.4);
  --cyan: #5ea1ff; --cyan-glow: rgba(94, 161, 255, 0.4); --border: rgba(100, 255, 218, 0.2); --fg-primary: #d8e8ff;
}
[data-theme="dracula"] {
  --bg-primary: #282a36; --bg-secondary: #21222c; --bg-tertiary: #2f3140;
  --accent: #bd93f9; --accent-soft: rgba(189, 147, 249, 0.15); --accent-glow: rgba(189, 147, 249, 0.4);
  --cyan: #8be9fd; --cyan-glow: rgba(139, 233, 253, 0.4); --red: #ff5555; --green: #50fa7b; --border: rgba(189, 147, 249, 0.2); --fg-primary: #f8f8f2;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font-mono);
  background: var(--bg-primary);
  color: var(--fg-primary);
  transition: background 0.4s, color 0.4s;
  position: relative;
}

.bg-image {
  position: fixed; inset: 0; background-size: cover; background-position: center;
  z-index: 0; opacity: 0; transition: opacity 0.6s, background-image 0.4s;
  filter: blur(3px) saturate(0.7);
}
.bg-image.active { opacity: var(--bg-opacity); }

.bg-overlay {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; transition: background 0.4s;
  background:
    radial-gradient(ellipse at top, var(--accent-soft), transparent 60%),
    radial-gradient(ellipse at bottom right, var(--cyan-glow), transparent 60%),
    linear-gradient(180deg, rgba(10, 13, 18, 0.88), rgba(10, 13, 18, 0.94));
}
.bg-overlay::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.4; mix-blend-mode: multiply;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px);
}

.loading {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px; background: var(--bg-primary); z-index: 10000; transition: opacity 0.4s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.loading-logo {
  font-family: var(--font-ui); font-size: 36px; font-weight: 700; letter-spacing: 0.18em;
  color: var(--accent); text-shadow: 0 0 30px var(--accent-glow);
  display: flex; align-items: center; gap: 12px; animation: logoPulse 2s ease-in-out infinite;
}
.loading-logo .accent { color: var(--cyan); text-shadow: 0 0 24px var(--cyan-glow); }
@keyframes logoPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.loading-spinner {
  width: 32px; height: 32px; border: 2px solid var(--border-soft); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
.loading-text { font-family: var(--font-ui); font-size: 11px; color: var(--fg-muted); letter-spacing: 0.25em; text-transform: uppercase; }
@keyframes spin { to { transform: rotate(360deg); } }

.app { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 2; }

.header {
  display: flex; align-items: stretch; justify-content: space-between; padding: 0 16px;
  border-bottom: 1px solid var(--border-soft);
  position: relative; z-index: 10; height: 50px; flex-shrink: 0;
  background: transparent; 
}
.header::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  z-index: -1; 
}
.header > * { position: relative; z-index: 1; }

.header-left { display: flex; align-items: stretch; gap: 16px; flex: 1; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding-right: 16px; border-right: 1px solid var(--border-soft); flex-shrink: 0; }
.brand-icon {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent-soft), transparent);
  border: 1px solid var(--border); border-radius: 7px; color: var(--accent); font-size: 13px;
  box-shadow: 0 0 16px var(--accent-soft), inset 0 0 8px var(--accent-soft);
}
.brand-text { font-family: var(--font-ui); font-size: 14px; font-weight: 700; letter-spacing: 0.18em; color: var(--fg-primary); }
.brand-accent { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

.tabs { display: flex; gap: 2px; align-items: flex-end; flex: 1; overflow-x: auto; scrollbar-width: none; padding: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: transparent;
  border: 1px solid transparent; border-bottom: none; border-radius: 7px 7px 0 0;
  color: var(--fg-muted); cursor: pointer; font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  transition: all 0.2s; position: relative; white-space: nowrap; margin-bottom: -1px;
}
.tab:hover { color: var(--fg-secondary); background: rgba(255, 255, 255, 0.03); }
.tab.active { color: var(--accent); background: var(--bg-secondary); border-color: var(--border); text-shadow: 0 0 12px var(--accent-glow); }
.tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent), 0 0 4px var(--accent); }
.tab-icon { font-size: 10px; opacity: 0.6; }
.tab.active .tab-icon { opacity: 1; }
.tab .close { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 3px; opacity: 0; transition: all 0.15s; margin-left: 4px; }
.tab:hover .close { opacity: 0.5; }
.tab .close:hover { background: rgba(255, 92, 87, 0.2); color: var(--red); opacity: 1; }
.tab-new {
  background: transparent; border: 1px dashed var(--border-soft); border-radius: 7px; color: var(--fg-muted);
  width: 34px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; align-self: center; flex-shrink: 0; font-size: 12px;
}
.tab-new:hover { color: var(--accent); border-color: var(--accent); border-style: solid; background: var(--accent-soft); box-shadow: 0 0 16px var(--accent-soft); }
.actions { display: flex; gap: 4px; align-items: center; padding-left: 12px; flex-shrink: 0; }
.icon-btn {
  width: 34px; height: 34px; background: transparent; border: 1px solid transparent; border-radius: 7px;
  color: var(--fg-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-size: 13px;
}
.icon-btn:hover { color: var(--accent); background: var(--accent-soft); border-color: var(--border); box-shadow: 0 0 12px var(--accent-soft); }

.terminal {
  flex: 1; overflow-y: auto; padding: 16px 20px 24px; font-family: var(--font-mono);
  font-size: var(--font-size); line-height: 1.65; position: relative; background: transparent; scroll-behavior: smooth;
}
.terminal::-webkit-scrollbar { width: 10px; }
.terminal::-webkit-scrollbar-track { background: transparent; }
.terminal::-webkit-scrollbar-thumb { background: var(--accent-soft); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
.terminal::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: padding-box; }

.line { white-space: pre-wrap; word-break: break-word; animation: lineIn 0.18s ease-out; padding: 1px 0; }
@keyframes lineIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
.line.input { color: var(--accent); }
.line.input::before { content: '> '; color: var(--accent); font-weight: 700; text-shadow: 0 0 8px var(--accent-glow); }
.line.continue { color: var(--fg-primary); }
.line.continue::before { content: '>> '; color: var(--cyan); font-weight: 700; text-shadow: 0 0 8px var(--cyan-glow); }
.line.output { color: var(--fg-primary); }
.line.error { color: var(--red); text-shadow: 0 0 8px rgba(255, 92, 87, 0.3); }
.line.system { color: var(--cyan); text-shadow: 0 0 8px var(--cyan-glow); }
.line.system::before { content: '# '; color: var(--cyan); opacity: 0.6; }
.line.empty { height: 0.5em; }

.banner {
  border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-bottom: 18px;
  background: linear-gradient(135deg, var(--accent-soft), transparent 70%); font-family: var(--font-ui);
  animation: lineIn 0.3s; position: relative; overflow: hidden;
}
.banner::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.banner-title { font-size: 20px; font-weight: 700; color: var(--accent); text-shadow: 0 0 16px var(--accent-glow); margin-bottom: 4px; letter-spacing: 0.05em; }
.banner-sub { font-size: 12px; color: var(--fg-secondary); font-weight: 400; letter-spacing: 0.04em; }
.banner-examples { margin-top: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); line-height: 1.9; }
.banner-examples .ex { 
  color: var(--cyan); 
  text-shadow: 0 0 6px var(--cyan-glow); 
  margin-right: 6px; 
  user-select: none; 
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}
.banner-shortcuts { 
  margin-top: 14px; 
  display: flex; 
  flex-wrap: wrap; 
  gap: 12px; 
  font-size: 11px; 
  color: var(--fg-muted); 
  font-family: var(--font-ui);
}
kbd { 
  background: rgba(255,255,255,0.05); 
  border: 1px solid var(--border-soft); 
  border-radius: 4px; 
  padding: 1px 5px; 
  font-family: var(--font-mono); 
  font-size: 10px; 
  color: var(--fg-secondary); 
  box-shadow: 0 1px 0 rgba(0,0,0,0.2);
}

.input-bar {
  display: flex; align-items: flex-start; padding: 14px 20px;
  border-top: 1px solid var(--border);
  gap: 14px; position: relative; flex-shrink: 0; z-index: 5;
  background: transparent; 
}
.input-bar::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  z-index: -1; 
}
.input-bar > * { position: relative; z-index: 1; }
.input-bar::after { content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.6; }

.prompt {
  color: var(--accent); font-weight: 700; font-size: calc(var(--font-size) + 2px);
  text-shadow: 0 0 12px var(--accent-glow); padding-top: 2px; user-select: none;
  font-family: var(--font-mono); min-width: 18px; transition: color 0.2s;
}

/* Monaco Container Styling */
#monaco-container {
  flex: 1; min-height: 22px; max-height: 200px; background: transparent;
  overflow: hidden; border: none; outline: none; color: var(--fg-primary);
  font-family: var(--font-mono); font-size: var(--font-size); line-height: 1.6;
  resize: none; caret-color: var(--accent);
}
.monaco-editor, .monaco-editor-background, .monaco-editor .margin { background: transparent !important; }
.monaco-editor .scroll-decoration { box-shadow: none !important; }

/* Explicitly Style Monaco Suggest Widget to ensure visibility */
.monaco-editor .suggest-widget {
  background-color: var(--bg-secondary) !important;
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
  z-index: 1000 !important;
  padding: 4px !important;
  font-family: var(--font-mono) !important;
  font-size: 13px !important;
  min-height: 20px !important;
}
.monaco-editor .suggest-widget .monaco-list-row {
  color: var(--fg-primary) !important;
  border-radius: 4px !important;
}
.monaco-editor .suggest-widget .monaco-list-row.focused {
  background-color: var(--accent-soft) !important;
  color: var(--accent) !important;
}
.monaco-editor .suggest-widget .monaco-list-row .monaco-icon-label {
  color: inherit !important;
  line-height: 20px !important; 
}
.monaco-editor .suggest-widget .monaco-list-row .suggest-icon::before {
  color: var(--cyan) !important;
  line-height: 20px !important;
}
.monaco-editor .editor-widget {
  z-index: 1000 !important;
}

.status-bar {
  display: flex; justify-content: space-between; align-items: center; padding: 6px 20px;
  background: var(--bg-primary); border-top: 1px solid var(--border-soft); font-family: var(--font-ui);
  font-size: 11px; color: var(--fg-muted); flex-shrink: 0; letter-spacing: 0.04em;
}
.status-bar .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 8px; box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; vertical-align: middle; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.status-bar .sep { margin: 0 8px; opacity: 0.4; }

.context-menu {
  position: fixed; background: var(--glass); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--border); border-radius: 10px; padding: 6px; min-width: 240px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--accent-soft); z-index: 1000; display: none;
  animation: menuIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes menuIn { from { opacity: 0; transform: scale(0.95) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.context-menu.visible { display: block; }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 6px; color: var(--fg-primary); cursor: pointer; font-family: var(--font-ui); font-size: 13px; transition: all 0.1s; user-select: none; position: relative; }
.menu-item:hover { background: var(--accent-soft); color: var(--accent); }
.menu-item i { width: 14px; text-align: center; color: var(--fg-muted); font-size: 12px; }
.menu-item:hover i { color: var(--accent); }
.menu-item.danger:hover { background: rgba(255, 92, 87, 0.12); color: var(--red); }
.menu-item.danger:hover i { color: var(--red); }
.menu-item.disabled { opacity: 0.35; pointer-events: none; }
.menu-shortcut { margin-left: auto; font-size: 10px; color: var(--fg-muted); font-family: var(--font-mono); letter-spacing: 0.05em; }
.menu-divider { height: 1px; background: var(--border-soft); margin: 5px 8px; }
.menu-item.has-submenu::after { content: '\f054'; font-family: 'Font Awesome 6 Free'; font-weight: 900; margin-left: auto; font-size: 9px; color: var(--fg-muted); }

/* Fix for submenu gap hover issue */
.menu-item.has-submenu::before {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 100%;
  width: 6px; /* Bridge the gap */
  background: transparent;
}

.submenu { 
  position: absolute; 
  left: 100%; 
  top: 0; 
  background: var(--glass); 
  backdrop-filter: blur(28px); 
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--border); 
  border-radius: 10px; 
  padding: 6px; 
  min-width: 180px; 
  display: none; 
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); 
  margin-left: 6px; 
}
.menu-item.has-submenu:hover .submenu { display: block; }
.submenu .menu-item.active { background: var(--accent-soft); color: var(--accent); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 2000; display: none; align-items: center; justify-content: center; animation: fadeIn 0.2s; padding: 20px; }
.modal-backdrop.visible { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px var(--accent-soft); animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.modal-icon { width: 38px; height: 38px; border-radius: 9px; background: var(--accent-soft); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 15px; box-shadow: 0 0 16px var(--accent-soft); }
.modal h2 { font-family: var(--font-ui); font-size: 19px; font-weight: 700; color: var(--fg-primary); letter-spacing: 0.02em; }
.modal .subtitle { color: var(--fg-muted); font-size: 12px; font-family: var(--font-ui); margin-bottom: 26px; margin-left: 50px; }
.field { margin-bottom: 22px; }
.field-label { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-ui); font-size: 11px; color: var(--fg-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
.field-label .value { color: var(--accent); text-transform: none; letter-spacing: 0; font-family: var(--font-mono); }
.field input[type="text"], .field input[type="url"] { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-soft); border-radius: 8px; padding: 11px 14px; color: var(--fg-primary); font-family: var(--font-mono); font-size: 13px; outline: none; transition: all 0.2s; }
.field input[type="text"]:focus, .field input[type="url"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input[type="range"] { width: 100%; accent-color: var(--accent); height: 4px; background: var(--border-soft); border-radius: 2px; cursor: pointer; }
.field select { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px 12px; color: var(--fg-primary); font-family: var(--font-mono); font-size: 13px; outline: none; cursor: pointer; transition: all 0.2s; }
.field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field select option { background: var(--bg-secondary); color: var(--fg-primary); }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.theme-btn { padding: 11px 12px; background: var(--bg-primary); border: 1px solid var(--border-soft); border-radius: 8px; cursor: pointer; font-family: var(--font-ui); font-size: 12px; color: var(--fg-secondary); transition: all 0.2s; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.theme-btn:hover { border-color: var(--accent); color: var(--fg-primary); }
.theme-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 12px var(--accent-soft); }
.theme-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-soft); }
.modal-actions .spacer { flex: 1; }
.btn { padding: 9px 18px; border: 1px solid var(--border-soft); border-radius: 8px; background: transparent; color: var(--fg-primary); cursor: pointer; font-family: var(--font-ui); font-size: 13px; font-weight: 500; transition: all 0.2s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { background: var(--accent); color: var(--bg-primary); box-shadow: 0 0 24px var(--accent-glow); }
.bg-preview { width: 100%; height: 80px; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid var(--border-soft); margin-top: 8px; display: flex; align-items: center; justify-content: center; color: var(--fg-muted); font-size: 11px; font-family: var(--font-ui); letter-spacing: 0.1em; text-transform: uppercase; position: relative; overflow: hidden; }
.bg-preview::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.5)); pointer-events: none; }
.bg-preview span { position: relative; z-index: 1; }

.toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; color: var(--fg-primary); font-family: var(--font-ui); font-size: 13px; z-index: 3000; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); display: flex; align-items: center; gap: 10px; animation: toastIn 0.3s, toastOut 0.3s 2.5s forwards; }
.toast i { color: var(--accent); }
.toast.success i { color: var(--green); }
.toast.error i { color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 20px); } }

@media (max-width: 720px) {
  .brand { display: none; } .header { padding: 0 10px; } .terminal { padding: 12px; } .input-bar { padding: 10px 12px; } .status-bar { padding: 5px 12px; font-size: 10px; }
}
::selection { background: var(--accent-soft); color: var(--accent); }
.tab, .menu-item, .btn, .icon-btn, .theme-btn, .tab-new { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>

<div class="bg-image" id="bgImage"></div>
<div class="bg-overlay"></div>

<div class="loading" id="loading">
  <div class="loading-logo"><span>LUA</span><span class="accent">REPL</span></div>
  <div class="loading-spinner"></div>
  <div class="loading-text">Initializing Runtime & Editor</div>
</div>

<div class="app" id="app" style="display:none">
  <header class="header">
    <div class="header-left">
      <div class="brand">
        <span class="brand-icon"><i class="fas fa-terminal"></i></span>
        <span class="brand-text">LUA<span class="brand-accent">REPL</span></span>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="newTabBtn" title="New Tab (Ctrl+T)"><i class="fas fa-plus"></i></button>
      <button class="icon-btn" id="settingsBtn" title="Settings (Ctrl+,)"><i class="fas fa-cog"></i></button>
    </div>
  </header>

  <main class="terminal" id="terminal"></main>

  <footer class="input-bar">
    <span class="prompt" id="prompt">&gt;</span>
    <div id="monaco-container"></div>
  </footer>

  <div class="status-bar">
    <span><span class="dot"></span>Ready</span>
    <span>
      <span id="statusTab">Session 1</span>
      <span class="sep">·</span>
      <span>Lua 5.3</span>
      <span class="sep">·</span>
      <span>Fengari</span>
      <span class="sep">·</span>
      <span>Shift+Enter to Run</span>
      <span class="sep">·</span>
      <span>Ctrl+Space for Autocomplete</span>
    </span>
  </div>
</div>

<div class="context-menu" id="contextMenu"></div>
<div id="modalContainer"></div>

<script>
// ============================================================
// Lua REPL Terminal — single-file implementation
// ============================================================

const STORAGE_KEY = 'lua-repl-terminal-v2'; 
const MAX_HISTORY = 100;
const MAX_OUTPUT_LINES = 1000;

// State
let tabs = [];
let activeTabId = null;
let nextTabId = 1;
let settings = {
  theme: 'ocean', // Set Ocean as the default theme
  background: '',
  bgOpacity: 0.25,
  fontSize: 14,
  backgroundSize: 'cover', // cover | stretch | fit | tile | normal
};

// DOM
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const tabsEl = $('#tabs');
const terminalEl = $('#terminal');
const statusTabEl = $('#statusTab');
const contextMenuEl = $('#contextMenu');
const modalContainer = $('#modalContainer');
const bgImageEl = $('#bgImage');

let editor = null; // Monaco instance

// Fuse.js Cache for Autocomplete
let suggestCache = { tabId: null, fuse: null };

// Theme catalog
const THEMES = {
  amber:     { name: 'Amber',     color: '#ffb800', swatch: 'linear-gradient(135deg,#ffb800,#ff8a00)' },
  cyberpunk: { name: 'Cyberpunk', color: '#ff2a6d', swatch: 'linear-gradient(135deg,#ff2a6d,#05d9e8)' },
  matrix:    { name: 'Matrix',    color: '#00ff41', swatch: 'linear-gradient(135deg,#00ff41,#008f11)' },
  ocean:     { name: 'Ocean',     color: '#64ffda', swatch: 'linear-gradient(135deg,#64ffda,#5ea1ff)' },
  dracula:   { name: 'Dracula',   color: '#bd93f9', swatch: 'linear-gradient(135deg,#bd93f9,#ff79c6)' },
};

// ============================================================
// Fengari API resolution
// ============================================================
let FAPI = null;

function resolveFengariAPI() {
  const F = window.fengari;
  if (!F) throw new Error('Fengari global not found');

  const lua = F.lua;
  const lauxlib = F.lauxlib;
  const lualib = F.lualib;

  if (!lua) throw new Error('fengari.lua module not found');
  if (!lauxlib) throw new Error('fengari.lauxlib module not found');

  let openlibsFn = null;
  if (lualib && typeof lualib.luaL_openlibs === 'function') openlibsFn = lualib.luaL_openlibs;
  else if (lauxlib && typeof lauxlib.luaL_openlibs === 'function') openlibsFn = lauxlib.luaL_openlibs;
  if (!openlibsFn) throw new Error('luaL_openlibs not found in fengari');

  const api = {
    lua, lauxlib,
    to_luastring: F.to_luastring,
    to_jsstring: F.to_jsstring,
    newstate: () => lauxlib.luaL_newstate(),
    openlibs: (L) => openlibsFn(L),
    loadstring: (L, s) => lauxlib.luaL_loadstring(L, s),
    close: (L) => lua.lua_close(L),
    pushjsfunction: (L, fn) => lua.lua_pushjsfunction(L, fn),
    setglobal: (L, name) => lua.lua_setglobal(L, F.to_luastring(name)),
    gettop: (L) => lua.lua_gettop(L),
    pop: (L, n) => lua.lua_pop(L, n),
    type: (L, idx) => lua.lua_type(L, idx),
    typename: (L, t) => lua.lua_typename(L, t),
    tojsstring: (L, idx) => lua.lua_tojsstring(L, idx),
    tonumber: (L, idx) => lua.lua_tonumber(L, idx),
    tointeger: (L, idx) => lua.lua_tointeger(L, idx),
    toboolean: (L, idx) => lua.lua_toboolean(L, idx),
    isinteger: (L, idx) => lua.lua_isinteger(L, idx),
    pushglobaltable: (L) => lua.lua_pushglobaltable(L),
    pushnil: (L) => lua.lua_pushnil(L),
    next: (L, idx) => lua.lua_next(L, idx),
    pcall: (L, nargs, nresults, msgh) => lua.lua_pcall(L, nargs, nresults, msgh),
    LUA_TNIL: lua.LUA_TNIL,
    LUA_TBOOLEAN: lua.LUA_TBOOLEAN,
    LUA_TNUMBER: lua.LUA_TNUMBER,
    LUA_TSTRING: lua.LUA_TSTRING,
    LUA_TTABLE: lua.LUA_TTABLE,
    LUA_TFUNCTION: lua.LUA_TFUNCTION,
    LUA_TUSERDATA: lua.LUA_TUSERDATA,
    LUA_TTHREAD: lua.LUA_TTHREAD,
    LUA_ERRSYNTAX: lua.LUA_ERRSYNTAX,
  };

  FAPI = api;
  return api;
}

// ============================================================
// Storage
// ============================================================
let saveTimer = null;
function saveState() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSaveState, 150);
}

function doSaveState() {
  try {
    const data = {
      settings,
      tabs: tabs.map(t => ({
        id: t.id,
        name: t.name,
        output: t.output.slice(-MAX_OUTPUT_LINES),
        history: t.history.slice(-MAX_HISTORY),
        editorContent: t.id === activeTabId && editor ? editor.getValue() : (t.editorContent || '')
      })),
      activeTabId,
      nextTabId,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('Save failed, trying with reduced history:', e);
    try {
      const data = {
        settings,
        tabs: tabs.map(t => ({
          id: t.id, name: t.name,
          output: t.output.slice(-100),
          history: t.history.slice(-50),
          editorContent: ''
        })),
        activeTabId, nextTabId,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      showToast('Storage limit reached: trimmed older history', 'error');
    } catch (e2) {
      console.error('Save completely failed:', e2);
      showToast('Could not save session: storage full', 'error');
    }
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

window.addEventListener('beforeunload', () => {
  // Prevent saving if we are explicitly deleting everything
  if (window.isDeletingAll) return;
  if (saveTimer) { clearTimeout(saveTimer); doSaveState(); }
});

// ============================================================
// LuaTab — one independent Lua VM per tab
// ============================================================
class LuaTab {
  constructor(id, name, savedOutput = null, savedHistory = null, savedEditorContent = null) {
    this.id = id;
    this.name = name;
    this.output = [];
    this.history = savedHistory || [];
    this.historyIndex = this.history.length;
    this.editorContent = savedEditorContent || '';
    this.luaState = null;
    this.isNew = savedOutput === null;
    this.initLua();
    if (savedOutput) this.output = savedOutput;
  }

  initLua() {
    try {
      const L = FAPI.newstate();
      FAPI.openlibs(L);
      this.luaState = L;
      this.setupPrint();
      this.setupCustomGlobals();
      if (this.isNew) this.showWelcome();
    } catch (e) {
      this.appendOutput('Failed to initialize Lua: ' + (e.message || e), 'error');
    }
  }

  showWelcome() { this.output.push({ text: '', type: 'banner' }); }

  setupPrint() {
    const L = this.luaState; const self = this;
    FAPI.pushjsfunction(L, function(L) {
      const n = FAPI.gettop(L); const args = [];
      for (let i = 1; i <= n; i++) args.push(self.luaDisplay(L, i));
      self.appendOutput(args.length ? args.join('\t') : '', 'output');
      return 0;
    });
    FAPI.setglobal(L, 'print');
  }

  setupCustomGlobals() {
    const L = this.luaState; const self = this;
    const addFn = (name, fn) => { FAPI.pushjsfunction(L, fn); FAPI.setglobal(L, name); };

    addFn('clear', () => { self.clear(); return 0; });
    addFn('cls',   () => { self.clear(); return 0; });

    addFn('help', () => {
      self.appendOutput([
        '═══ Available Commands ═══', '',
        '  clear()       Clear terminal output',
        '  cls()         Alias for clear()',
        '  help()        Show this help message',
        '  vars()        List all global variables',
        '  reset()       Reset Lua state',
        '  about()       Show about info', '',
        '═══ Keyboard Shortcuts ═══', '',
        '  Shift+Enter   Execute code',
        '  Ctrl+Space    Trigger autocomplete',
        '  Up / Down     Navigate command history (on empty line)',
        '  Tab           Autocomplete / Insert indentation',
        '  Ctrl+L        Clear terminal',
        '  Ctrl+T        New tab',
        '  Right-click   Open context menu', '',
        '═══ Standard Libraries ═══', '',
        '  string  table  math  io  os',
        '  coroutine  debug  package  utf8',
      ].join('\n'), 'system');
      return 0;
    });

    addFn('vars', () => {
      const vars = [];
      FAPI.pushglobaltable(L); FAPI.pushnil(L);
      while (FAPI.next(L, -2) !== 0) {
        const key = FAPI.tojsstring(L, -2); const t = FAPI.type(L, -1); const typeName = FAPI.typename(L, t);
        vars.push('  ' + (key || '?').padEnd(16) + ' ' + typeName);
        FAPI.pop(L, 1);
      }
      FAPI.pop(L, 1); vars.sort();
      self.appendOutput('Global variables (' + vars.length + '):\n' + vars.join('\n'), 'system');
      return 0;
    });

    addFn('reset', () => {
      if (self.luaState) { try { FAPI.close(self.luaState); } catch(e){} }
      self.output = []; self.isNew = true; self.initLua(); self.isNew = false;
      if (self.id === activeTabId) renderOutput();
      return 0;
    });

    addFn('about', () => {
      self.appendOutput([
        '═══ Lua REPL Terminal ═══', '',
        'Powered by Fengari — a Lua 5.3 VM written in JavaScript.',
        'All computation runs locally in your browser.', '',
        '═══ Shortcuts ═══', '',
        '  Shift + Enter  Execute code',
        '  Ctrl + Space   Trigger autocomplete',
        '  Up / Down      Navigate command history',
        '  Ctrl + L       Clear terminal',
        '  Ctrl + T       New tab',
        '  Right-click    Open context menu', ''
      ].join('\n'), 'system');
      return 0;
    });
  }

  luaDisplay(L, idx) {
    const t = FAPI.type(L, idx);
    if (t === FAPI.LUA_TNIL) return 'nil';
    if (t === FAPI.LUA_TBOOLEAN) return FAPI.toboolean(L, idx) ? 'true' : 'false';
    if (t === FAPI.LUA_TNUMBER) return FAPI.isinteger(L, idx) ? String(FAPI.tointeger(L, idx)) : String(FAPI.tonumber(L, idx));
    if (t === FAPI.LUA_TSTRING) return FAPI.tojsstring(L, idx);
    if (t === FAPI.LUA_TTABLE) return 'table: 0x' + (Math.floor(Math.random() * 0xfffffff) | 0).toString(16);
    if (t === FAPI.LUA_TFUNCTION) return 'function: 0x' + (Math.floor(Math.random() * 0xfffffff) | 0).toString(16);
    if (t === FAPI.LUA_TUSERDATA) return 'userdata';
    if (t === FAPI.LUA_TTHREAD) return 'thread';
    return FAPI.typename(L, t) || '?';
  }

  appendOutput(text, type = 'output') {
    const lines = String(text).split('\n');
    for (const line of lines) this.output.push({ text: line, type });
    if (this.output.length > MAX_OUTPUT_LINES) this.output = this.output.slice(-MAX_OUTPUT_LINES);
    if (this.id === activeTabId) renderOutput();
    saveState();
  }

  clear() { this.output = []; if (this.id === activeTabId) renderOutput(); saveState(); }

  tryExecute(code) {
    if (!this.luaState) { this.appendOutput('Lua state not initialized', 'error'); return; }
    const L = this.luaState;

    // Format input echo with proper > and >> prefixes
    const codeLines = code.split('\n');
    this.output.push({ text: codeLines[0], type: 'input' });
    for (let i = 1; i < codeLines.length; i++) {
      this.output.push({ text: codeLines[i], type: 'continue' });
    }
    if (this.id === activeTabId) renderOutput();

    const status = FAPI.loadstring(L, FAPI.to_luastring(code));

    if (status === FAPI.LUA_ERRSYNTAX) {
      const err = FAPI.tojsstring(L, -1); FAPI.pop(L, 1);
      this.appendOutput(err || 'Syntax error', 'error');
      this.addToHistory(code);
      return;
    } else if (status !== 0) {
      const err = FAPI.tojsstring(L, -1); FAPI.pop(L, 1);
      this.appendOutput(err || 'Unknown error', 'error');
      this.addToHistory(code);
      return;
    }

    const execStatus = FAPI.pcall(L, 0, 0, 0);
    if (execStatus !== 0) {
      const err = FAPI.tojsstring(L, -1); FAPI.pop(L, 1);
      this.appendOutput(err || 'Runtime error', 'error');
    }

    this.addToHistory(code);
    
    // Invalidate cache since execution might have created new globals
    suggestCache.tabId = null; 
    saveState();
  }

  addToHistory(code) {
    if (!code || !code.trim()) return;
    if (this.history.length > 0 && this.history[this.history.length - 1] === code) return;
    this.history.push(code);
    if (this.history.length > MAX_HISTORY) this.history.shift();
    this.historyIndex = this.history.length;
    saveState();
  }

  // Dynamically evaluate a prefix expression (e.g., "myTable.field") 
  // to provide session-aware table key completions!
  getCompletionKeys(expr) {
    if (!this.luaState) return [];
    const L = this.luaState;
    const keys = [];
    
    try {
      // Equivalent to: loadstring("return " .. expr)
      const status = FAPI.loadstring(L, FAPI.to_luastring("return " + expr));
      if (status !== 0) {
        if (FAPI.gettop(L) > 0) FAPI.pop(L, 1); // pop error
        return [];
      }
      
      // Execute the chunk safely with pcall
      const execStatus = FAPI.pcall(L, 0, 1, 0);
      if (execStatus !== 0) {
        if (FAPI.gettop(L) > 0) FAPI.pop(L, 1); // pop error
        return [];
      }
      
      // If the result is a table, extract its string keys
      if (FAPI.type(L, -1) === FAPI.LUA_TTABLE) {
        FAPI.pushnil(L);
        while (FAPI.next(L, -2) !== 0) {
          if (FAPI.type(L, -2) === FAPI.LUA_TSTRING) {
            const key = FAPI.tojsstring(L, -2);
            const valType = FAPI.type(L, -1);
            let kind = 5; // Variable
            if (valType === FAPI.LUA_TFUNCTION) kind = 2; // Function
            else if (valType === FAPI.LUA_TTABLE) kind = 8; // Module
            keys.push({ label: key, kind: kind, detail: 'Runtime Field' });
          }
          FAPI.pop(L, 1); // pop value
        }
      } 
      // If the result is a string, proactively suggest string library methods!
      else if (FAPI.type(L, -1) === FAPI.LUA_TSTRING) {
        const strFuncs = ['len', 'sub', 'upper', 'lower', 'rep', 'format', 'find', 'match', 'gmatch', 'gsub', 'byte', 'char'];
        strFuncs.forEach(f => {
          keys.push({ label: f, kind: 2, detail: 'string.' + f });
        });
      }
      
      FAPI.pop(L, 1); // pop the result table/string
    } catch (e) {
      console.error("Error evaluating expr for autocomplete:", e);
    }
    
    return keys;
  }

  destroy() {
    if (this.luaState) { try { FAPI.close(this.luaState); } catch (e) {} this.luaState = null; }
  }
}

// ============================================================
// Monaco Editor Setup
// ============================================================
function defineLuaLanguage() {
  monaco.languages.setMonarchTokensProvider('lua', {
    defaultToken: '',
    tokenPostfix: '.lua',
    keywords: [
      'and', 'break', 'do', 'else', 'elseif', 'end', 'false', 'for', 'function', 'goto', 'if',
      'in', 'local', 'nil', 'not', 'or', 'repeat', 'return', 'then', 'true', 'until', 'while'
    ],
    operators: [
      '+', '-', '*', '/', '%', '^', '#', '==', '~=', '<=', '>=', '<', '>',
      '=', '..', '::', '...', '//', '&', '|', '~', '<<', '>>'
    ],
    symbols: /[=><!~?:&|+\-*/^%]+/,
    escapes: /\\(?:[abfnrtv\\"'z]|x[0-9A-Fa-f]{1,4}|u[0-9A-Fa-f]{4}|U[0-9A-Fa-f]{8})/,
    tokenizer: {
      root: [
        [/--\[=*\[/, { token: 'comment', next: '@longComment' }],
        [/\[=*\[/, { token: 'string', next: '@longString' }],
        [/--.*$/, 'comment'],
        [/"(?:[^"\\]|\\.)*$/, 'string.invalid'],
        [/'(?:[^'\\]|\\.)*$/, 'string.invalid'],
        [/"/,  { token: 'string.quote', bracket: '@open', next: '@dstring' }],
        [/'/,  { token: 'string.quote', bracket: '@open', next: '@sstring' }],
        [/0[xX][0-9a-fA-F]*\.[0-9a-fA-F]+(?:[pP][-+]?[0-9]+)?/, 'number'],
        [/0[xX][0-9a-fA-F]+/, 'number'],
        [/\d+\.?\d*(?:[eE][-+]?\d+)?/, 'number'],
        [/\.\d+(?:[eE][-+]?\d+)?/, 'number'],
        [/[a-zA-Z_]\w*/, {
          cases: {
            '@keywords': 'keyword',
            '@default': 'identifier'
          }
        }],
        [/@symbols/, {
          cases: {
            '@operators': 'operator',
            '@default': ''
          }
        }],
        { include: '@whitespace' },
        [/[{}()\[\]]/, '@brackets'],
        [/[;,.]/, 'delimiter']
      ],
      whitespace: [
        [/[ \t\r\n]+/, '']
      ],
      dstring: [
        [/[^\\"]+/, 'string'],
        [/@escapes/, 'string.escape'],
        [/\\./, 'string.escape.invalid'],
        [/"/, { token: 'string.quote', bracket: '@close', next: '@pop' }]
      ],
      sstring: [
        [/[^\\']+/, 'string'],
        [/@escapes/, 'string.escape'],
        [/\\./, 'string.escape.invalid'],
        [/'/, { token: 'string.quote', bracket: '@close', next: '@pop' }]
      ],
      longString: [
        [/\]=*\]/, { token: 'string', next: '@pop' }],
        [/[^]/, 'string']
      ],
      longComment: [
        [/\]=*\]/, { token: 'comment', next: '@pop' }],
        [/[^]/, 'comment']
      ]
    }
  });
}

function getLuaGlobals() {
  const tab = getActiveTab();
  if (!tab || !tab.luaState) return [];
  const L = tab.luaState;
  const vars = [];
  try {
    FAPI.pushglobaltable(L);
    FAPI.pushnil(L);
    while (FAPI.next(L, -2) !== 0) {
      if (FAPI.type(L, -2) === FAPI.LUA_TSTRING) {
        const key = FAPI.tojsstring(L, -2);
        if (key) {
          const t = FAPI.type(L, -1);
          let kind = 5; // Variable
          if (t === FAPI.LUA_TFUNCTION) kind = 2; // Function
          else if (t === FAPI.LUA_TTABLE) kind = 8; // Module
          vars.push({ label: key, kind: kind });
        }
      }
      FAPI.pop(L, 1);
    }
    FAPI.pop(L, 1);
  } catch (err) {
    console.error("Error fetching Lua globals:", err);
  }
  return vars;
}

// Builds and caches the Fuse.js instance for fuzzy searching global variables
function getSuggestionsFuse(tab) {
  if (suggestCache.fuse && suggestCache.tabId === tab.id) {
    return suggestCache.fuse;
  }

  const allItemsMap = new Map();
  
  // Add Lua keywords
  const keywords = ['and', 'break', 'do', 'else', 'elseif', 'end', 'false', 'for', 'function', 'goto', 'if', 'in', 'local', 'nil', 'not', 'or', 'repeat', 'return', 'then', 'true', 'until', 'while'];
  keywords.forEach(k => allItemsMap.set(k, { label: k, kind: monaco.languages.CompletionItemKind.Keyword, detail: 'keyword' }));

  // Add standard base library functions to ensure they are always present
  const baseFuncs = ['print', 'type', 'tonumber', 'tostring', 'ipairs', 'pairs', 'next', 'select', 'error', 'assert', 'pcall', 'xpcall', 'rawget', 'rawset', 'rawequal', 'rawlen', 'setmetatable', 'getmetatable', 'require', 'load', 'loadstring', 'dofile', 'unpack'];
  baseFuncs.forEach(f => allItemsMap.set(f, { label: f, kind: monaco.languages.CompletionItemKind.Function, detail: 'base.' + f }));

  // Fetch live globals (overrides base funcs if user redefined them)
  const liveGlobals = getLuaGlobals();
  liveGlobals.forEach(g => allItemsMap.set(g.label, { label: g.label, kind: g.kind, detail: 'Lua Global' }));

  // Add standard library functions
  const libFuncs = {
    'string': ['len', 'sub', 'upper', 'lower', 'rep', 'format', 'find', 'match', 'gmatch', 'gsub', 'byte', 'char'],
    'table': ['insert', 'remove', 'concat', 'sort', 'unpack', 'pack'],
    'math': ['floor', 'ceil', 'abs', 'sqrt', 'sin', 'cos', 'tan', 'random', 'randomseed', 'pi', 'max', 'min'],
    'os': ['time', 'date', 'clock', 'getenv', 'exit'],
    'io': ['read', 'write', 'open', 'close', 'lines']
  };

  for (const lib in libFuncs) {
    libFuncs[lib].forEach(f => allItemsMap.set(f, { label: f, kind: monaco.languages.CompletionItemKind.Function, detail: lib + '.' + f }));
  }

  const allItems = Array.from(allItemsMap.values());

  // Create Fuse instance with relaxed fuzzy matching
  const fuse = new Fuse(allItems, {
    keys: ['label'],
    includeScore: true,
    threshold: 0.5, 
    ignoreLocation: true,
    shouldSort: true,
    minMatchCharLength: 1,
    findAllMatches: true
  });

  suggestCache = { tabId: tab.id, fuse: fuse };
  return fuse;
}

function setupMonaco() {
  defineLuaLanguage(); 
  updateMonacoTheme(); 

  const container = document.getElementById('monaco-container');
  editor = monaco.editor.create(container, {
    value: '',
    language: 'lua',
    theme: 'lua-repl-theme',
    fontFamily: "'JetBrains Mono', 'Menlo', monospace",
    fontSize: settings.fontSize,
    lineHeight: Math.round(settings.fontSize * 1.6),
    minimap: { enabled: false },
    automaticLayout: true,
    scrollBeyondLastLine: false,
    lineNumbers: 'off',
    folding: false,
    renderLineHighlight: 'none',
    overviewRulerBorder: false,
    roundedSelection: false,
    fixedOverflowWidgets: true, 
    scrollbar: { vertical: 'auto', horizontal: 'hidden', useShadows: false },
    padding: { top: 2, bottom: 2 },
    contextmenu: false, 
    quickSuggestions: { other: true, comments: false, strings: false },
    suggestOnTriggerCharacters: true,
    wordBasedSuggestions: false, 
    tabCompletion: 'on',
    tabSize: 2,
  });

  // Shift+Enter to execute
  editor.addCommand(monaco.KeyMod.Shift | monaco.KeyCode.Enter, executeCode);
  // Ctrl+Space to explicitly trigger autocomplete
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Space, () => {
    editor.trigger('keyboard', 'editor.action.triggerSuggest', {});
  });

  // Handle History Navigation & Shortcuts
  editor.onKeyDown(e => {
    const tab = getActiveTab();
    if (!tab) return;
    const browserEvent = e.browserEvent;

    // Detect if Monaco's autocomplete widget is currently visible
    const isSuggestWidgetVisible = editor.getDomNode().querySelector('.suggest-widget.visible') !== null;
    
    // History Up
    if (e.keyCode === monaco.KeyCode.UpArrow) {
      // Let Monaco handle Up/Down if the suggest widget is open
      if (isSuggestWidgetVisible) return; 
      
      const pos = editor.getPosition();
      if (pos.lineNumber === 1) {
        e.preventDefault();
        e.stopPropagation();
        if (tab.history.length > 0 && tab.historyIndex > 0) {
          tab.historyIndex--;
          editor.setValue(tab.history[tab.historyIndex]);
          const lastLine = editor.getModel().getLineCount();
          editor.setPosition({ lineNumber: lastLine, column: editor.getModel().getLineLength(lastLine) + 1 });
        }
      }
    }
    // History Down
    else if (e.keyCode === monaco.KeyCode.DownArrow) {
      // Let Monaco handle Up/Down if the suggest widget is open
      if (isSuggestWidgetVisible) return;
      
      const pos = editor.getPosition();
      const lineCount = editor.getModel().getLineCount();
      if (pos.lineNumber === lineCount) {
        e.preventDefault();
        e.stopPropagation();
        if (tab.history.length > 0) {
          if (tab.historyIndex < tab.history.length - 1) {
            tab.historyIndex++;
            editor.setValue(tab.history[tab.historyIndex]);
          } else if (tab.historyIndex === tab.history.length - 1) {
            tab.historyIndex = tab.history.length;
            editor.setValue('');
          }
          const lastLine = editor.getModel().getLineCount();
          editor.setPosition({ lineNumber: lastLine, column: editor.getModel().getLineLength(lastLine) + 1 });
        }
      }
    }
    // Ctrl+L Clear Terminal
    else if (browserEvent.key === 'l' && browserEvent.ctrlKey) {
      e.preventDefault(); e.stopPropagation(); tab.clear();
    }
    // Ctrl+C Clear Editor (if no selection)
    else if (browserEvent.key === 'c' && browserEvent.ctrlKey) {
      const selection = editor.getSelection();
      if (selection.isEmpty()) {
        e.preventDefault(); e.stopPropagation(); editor.setValue('');
      }
    }
  });

  // Auto-resize container height based on content
  editor.onDidContentSizeChange(() => {
    const contentHeight = Math.min(200, editor.getContentHeight());
    container.style.height = contentHeight + 'px';
  });

  // Smart Autocomplete Provider
  monaco.languages.registerCompletionItemProvider('lua', {
    triggerCharacters: ['.', ':'],
    provideCompletionItems: (model, position) => {
      let isInsideStringOrComment = false;
      
      // 1. Prevent autocomplete inside strings or comments
      try {
        const tokenization = model.tokenization;
        const lineTokens = tokenization.getLineTokens(position.lineNumber);
        const tokenIndex = lineTokens.findTokenIndexAtOffset(position.column - 1);
        const tokenType = lineTokens.getTokenType(tokenIndex);
        
        if (tokenType === 'string' || tokenType === 'string.escape' || tokenType === 'comment' || 
            tokenType.startsWith('string.') || tokenType.startsWith('comment.')) {
          isInsideStringOrComment = true;
        }
      } catch (e) {
        console.warn("Token check failed:", e);
      }

      if (isInsideStringOrComment) {
        return { suggestions: [] };
      }

      const tab = getActiveTab();
      if (!tab) return { suggestions: [] };

      const line = model.getLineContent(position.lineNumber);
      const textBefore = line.substring(0, position.column - 1);
      
      // 2. Check if we are indexing a table (session-aware logic)
      const dotIndex = Math.max(textBefore.lastIndexOf('.'), textBefore.lastIndexOf(':'));
      if (dotIndex !== -1) {
        const potentialExpr = textBefore.substring(0, dotIndex).trim();
        // Match valid Lua identifier chains (e.g., myTable.subTable)
        const exprMatch = potentialExpr.match(/([a-zA-Z_]\w*(?:\s*[.:]\s*[a-zA-Z_]\w*)*)$/);
        
        if (exprMatch) {
          const expr = exprMatch[1];
          const partialWord = textBefore.substring(dotIndex + 1).trim();
          
          // Only trigger if partialWord is a valid identifier or empty
          if (partialWord === "" || /^[a-zA-Z_]\w*$/.test(partialWord)) {
            // Evaluate the expression in the live Lua state!
            const runtimeKeys = tab.getCompletionKeys(expr);
            
            const range = {
              startLineNumber: position.lineNumber,
              endLineNumber: position.lineNumber,
              startColumn: position.column - partialWord.length,
              endColumn: position.column
            };
            
            const suggestions = runtimeKeys
              .filter(k => k.label.startsWith(partialWord))
              .map(k => ({
                label: k.label,
                kind: k.kind,
                insertText: k.label,
                range: range,
                detail: k.detail
              }));
              
            return { suggestions };
          }
        }
      }

      // 3. Fallback to Fuse.js fuzzy global search if no dot/colon
      const word = model.getWordUntilPosition(position);
      const currentWord = model.getValueInRange({
        startLineNumber: position.lineNumber,
        endLineNumber: position.lineNumber,
        startColumn: word.startColumn,
        endColumn: word.endColumn
      });

      const fuse = getSuggestionsFuse(tab);
      let results = [];

      if (currentWord.length === 0) {
        results = fuse.getIndex().docs.slice().sort((a, b) => a.label.localeCompare(b.label)).slice(0, 30).map(item => ({ item }));
      } else {
        results = fuse.search(currentWord).slice(0, 30);
      }

      const range = {
        startLineNumber: position.lineNumber,
        endLineNumber: position.lineNumber,
        startColumn: word.startColumn,
        endColumn: word.endColumn
      };

      const suggestions = results.map(res => ({
        label: res.item.label,
        kind: res.item.kind,
        insertText: res.item.label,
        range: range,
        detail: res.item.detail
      }));

      return { suggestions };
    }
  });
}

function updateMonacoTheme() {
  if (!window.monaco) return;
  const styles = getComputedStyle(document.documentElement);
  
  const hex = (c) => {
    c = c.trim();
    if (c.startsWith('#')) {
      let h = c.substring(1);
      if (h.length === 3) h = h.split('').map(x => x + x).join('');
      return h;
    }
    const match = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if (match) {
      return (+match[1]).toString(16).padStart(2,'0') + (+match[2]).toString(16).padStart(2,'0') + (+match[3]).toString(16).padStart(2,'0');
    }
    return 'e8e4d4';
  };

  const fg = styles.getPropertyValue('--fg-primary');
  const accent = styles.getPropertyValue('--accent');
  const cyan = styles.getPropertyValue('--cyan');
  const green = styles.getPropertyValue('--green');
  const muted = styles.getPropertyValue('--fg-muted');
  const bgSec = styles.getPropertyValue('--bg-secondary');
  const border = styles.getPropertyValue('--border');

  monaco.editor.defineTheme('lua-repl-theme', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: '', foreground: hex(fg) },
      { token: 'keyword', foreground: hex(accent) },
      { token: 'number', foreground: hex(cyan) },
      { token: 'string', foreground: hex(green) },
      { token: 'comment', foreground: hex(muted), fontStyle: 'italic' },
      { token: 'delimiter', foreground: hex(fg) },
      { token: 'identifier', foreground: hex(fg) },
      { token: 'operator', foreground: hex(fg) },
      { token: 'function', foreground: hex(cyan) },
      { token: 'type', foreground: hex(accent) },
    ],
    colors: {
      'editor.background': '#00000000',
      'editor.lineHighlightBackground': '#00000000',
      'editorGutter.background': '#00000000',
      'editor.selectionBackground': hex(accent) + '33',
      'editor.foreground': hex(fg),
      'editorCursor.foreground': hex(accent),
      'editorSuggestWidget.background': hex(bgSec),
      'editorSuggestWidget.border': hex(border),
      'editorSuggestWidget.foreground': hex(fg),
      'editorSuggestWidget.selectedBackground': hex(accent) + '33',
      'editorSuggestWidget.highlightForeground': hex(accent),
      'editorWidget.background': hex(bgSec),
      'editorWidget.border': hex(border),
    }
  });

  if (editor) monaco.editor.setTheme('lua-repl-theme');
}

// ============================================================
// Execution & Rendering
// ============================================================
function executeCode() {
  const tab = getActiveTab();
  if (!tab) return;
  const code = editor.getValue();
  if (!code.trim()) return;
  editor.setValue('');
  tab.editorContent = '';
  tab.tryExecute(code);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function renderTabs() {
  tabsEl.innerHTML = '';
  for (const tab of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
    el.innerHTML = `
      <i class="fas fa-terminal tab-icon"></i>
      <span>${escapeHtml(tab.name)}</span>
      ${tabs.length > 1 ? '<span class="close" data-action="close" title="Close tab"><i class="fas fa-times" style="font-size:9px"></i></span>' : ''}
    `;
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="close"]')) { e.stopPropagation(); closeTab(tab.id); }
      else switchTab(tab.id);
    });
    tabsEl.appendChild(el);
  }
}

function renderOutput() {
  const tab = getActiveTab();
  if (!tab) return;
  terminalEl.innerHTML = '';

  for (const line of tab.output) {
    if (line.type === 'banner') {
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.innerHTML = `
        <div class="banner-title">LUA REPL TERMINAL</div>
        <div class="banner-sub">Lua 5.3 · Fengari VM · Interactive Session</div>
        <div class="banner-examples">
          <div><span class="ex">&gt;</span>print("Hello, World!")</div>
          <div><span class="ex">&gt;</span>for i=1,5 do print(i) end</div>
          <div><span class="ex">&gt;</span>local t = {1,2,3}; print(table.concat(t, ", "))</div>
          <div><span class="ex">&gt;</span>help()</div>
        </div>
        <div class="banner-shortcuts">
          <span><kbd>Shift</kbd>+<kbd>Enter</kbd> Run</span>
          <span><kbd>Ctrl</kbd>+<kbd>Space</kbd> Autocomplete</span>
          <span><kbd>Ctrl</kbd>+<kbd>L</kbd> Clear</span>
          <span><kbd>Right-Click</kbd> Menu</span>
        </div>
      `;
      terminalEl.appendChild(banner);
      continue;
    }
    const el = document.createElement('div');
    if (line.text === '' && line.type === 'output') el.className = 'line empty';
    else el.className = 'line ' + line.type;
    el.textContent = line.text;
    terminalEl.appendChild(el);
  }

  requestAnimationFrame(() => { terminalEl.scrollTop = terminalEl.scrollHeight; });
}

function updateStatus() {
  const tab = getActiveTab();
  if (tab) statusTabEl.textContent = tab.name;
}

// ============================================================
// Tab management
// ============================================================
function getActiveTab() { return tabs.find(t => t.id === activeTabId); }

function newTab(name = null) {
  if (editor) {
    const currentTab = getActiveTab();
    if (currentTab) currentTab.editorContent = editor.getValue();
  }
  const id = nextTabId++;
  const tab = new LuaTab(id, name || 'Session ' + id);
  tabs.push(tab);
  activeTabId = id;
  suggestCache.tabId = null; 
  if (editor) editor.setValue('');
  renderTabs(); renderOutput(); updateStatus();
  if (editor) editor.focus();
  saveState();
  return tab;
}

function closeTab(id) {
  if (tabs.length <= 1) { showToast('Cannot close the last tab', 'error'); return; }
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  tabs[idx].destroy();
  tabs.splice(idx, 1);
  if (activeTabId === id) {
    activeTabId = tabs[Math.min(idx, tabs.length - 1)].id;
    suggestCache.tabId = null; 
    if (editor) editor.setValue(getActiveTab().editorContent || '');
  }
  renderTabs(); renderOutput(); updateStatus();
  if (editor) editor.focus();
  saveState();
  showToast('Tab closed', 'success');
}

function switchTab(id) {
  if (id === activeTabId) return;
  const currentTab = getActiveTab();
  if (currentTab && editor) currentTab.editorContent = editor.getValue();
  
  activeTabId = id;
  suggestCache.tabId = null; 
  const newTab = getActiveTab();
  if (newTab && editor) {
    editor.setValue(newTab.editorContent || '');
    const lastLine = editor.getModel().getLineCount();
    editor.setPosition({ lineNumber: lastLine, column: editor.getModel().getLineLength(lastLine) + 1 });
  }
  renderTabs(); renderOutput(); updateStatus();
  if (editor) editor.focus();
  saveState();
}

function deleteAllSessions() {
  hideContextMenu();
  // Destroy all existing Lua states
  tabs.forEach(tab => tab.destroy());
  tabs = [];
  activeTabId = null;
  nextTabId = 1;
  
  // Clear local storage completely
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {
    console.error("Failed to clear localStorage:", e);
  }
  
  // Set flag to prevent beforeunload from saving the wiped state
  window.isDeletingAll = true;
  
  // Reload the page to ensure a completely clean slate (Monaco, DOM, etc.)
  window.location.reload();
}

// ============================================================
// Global keyboard shortcuts
// ============================================================
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.altKey) && e.key.toLowerCase() === 't' && !e.shiftKey) { e.preventDefault(); newTab(); }
  if (e.altKey && e.key.toLowerCase() === 'w') { e.preventDefault(); closeTab(activeTabId); }
  if (e.ctrlKey && e.key === ',') { e.preventDefault(); openSettings(); }
  if (e.key === 'Escape') { hideContextMenu(); closeSettings(); }
});

// ============================================================
// Context menu
// ============================================================
function showContextMenu(x, y) {
  const tab = getActiveTab();
  const items = [
    { label: 'New Tab', icon: 'fa-plus', shortcut: 'Ctrl+T', action: () => newTab() },
    { label: 'Close Tab', icon: 'fa-times', danger: true, shortcut: 'Alt+W', action: () => closeTab(activeTabId), disabled: tabs.length <= 1 },
    'divider',
    { label: 'Clear Terminal', icon: 'fa-eraser', shortcut: 'Ctrl+L', action: () => tab && tab.clear() },
    { label: 'Reset Lua State', icon: 'fa-arrow-rotate-right', action: () => {
      if (!tab) return;
      tab.output = []; tab.isNew = true; tab.initLua(); tab.isNew = false;
      renderOutput(); showToast('Lua state reset', 'success');
    }},
    'divider',
    { label: 'Set Background Image...', icon: 'fa-image', action: () => openSettings('background') },
    { label: 'Change Theme', icon: 'fa-palette', submenu: 'theme' },
    { label: 'Settings', icon: 'fa-cog', shortcut: 'Ctrl+,', action: () => openSettings() },
    'divider',
    { label: 'Copy Output', icon: 'fa-copy', action: () => copyOutput() },
    { label: 'Export Session', icon: 'fa-download', action: () => exportOutput() },
    { label: 'About', icon: 'fa-circle-info', action: () => {
      if (tab) tab.appendOutput(['Lua REPL Terminal · v1.0','Powered by Fengari (Lua 5.3 VM in JavaScript)','All computation runs locally in your browser.','Right-click anywhere for options.'].join('\n'), 'system');
    }},
    'divider',
    { label: 'Delete All Sessions', icon: 'fa-trash', danger: true, action: deleteAllSessions }
  ];
  buildMenu(items, x, y);
}

function buildMenu(items, x, y) {
  contextMenuEl.innerHTML = '';
  for (const item of items) {
    if (item === 'divider') {
      const d = document.createElement('div'); d.className = 'menu-divider'; contextMenuEl.appendChild(d); continue;
    }
    if (item.submenu === 'theme') {
      const wrap = document.createElement('div'); wrap.className = 'menu-item has-submenu';
      wrap.innerHTML = '<i class="fas ' + item.icon + '"></i><span>' + escapeHtml(item.label) + '</span>';
      const sub = document.createElement('div'); sub.className = 'submenu';
      for (const [key, t] of Object.entries(THEMES)) {
        const sm = document.createElement('div'); sm.className = 'menu-item' + (settings.theme === key ? ' active' : '');
        sm.innerHTML = '<div class="theme-swatch" style="background:' + t.swatch + ';color:' + t.color + '"></div><span>' + t.name + '</span>';
        sm.addEventListener('click', (e) => {
          e.stopPropagation(); settings.theme = key; applySettings(); saveState();
          hideContextMenu(); showToast('Theme: ' + t.name, 'success');
        });
        sub.appendChild(sm);
      }
      wrap.appendChild(sub); contextMenuEl.appendChild(wrap); continue;
    }
    const el = document.createElement('div');
    el.className = 'menu-item' + (item.danger ? ' danger' : '') + (item.disabled ? ' disabled' : '');
    el.innerHTML = '<i class="fas ' + (item.icon || '') + '"></i><span>' + escapeHtml(item.label) + '</span>' + (item.shortcut ? '<span class="menu-shortcut">' + item.shortcut + '</span>' : '');
    el.addEventListener('click', () => { hideContextMenu(); item.action && item.action(); });
    contextMenuEl.appendChild(el);
  }
  contextMenuEl.style.left = '0px'; contextMenuEl.style.top = '0px'; contextMenuEl.classList.add('visible');
  const rect = contextMenuEl.getBoundingClientRect();
  contextMenuEl.style.left = Math.min(x, window.innerWidth - rect.width - 8) + 'px';
  contextMenuEl.style.top = Math.min(y, window.innerHeight - rect.height - 8) + 'px';
}

function hideContextMenu() { contextMenuEl.classList.remove('visible'); }
document.addEventListener('contextmenu', (e) => { e.preventDefault(); showContextMenu(e.clientX, e.clientY); });
document.addEventListener('click', (e) => { if (!e.target.closest('.context-menu')) hideContextMenu(); });
document.addEventListener('scroll', hideContextMenu, true);

    </div>
  `;
  let pTheme = settings.theme, pBg = settings.background, pBgOp = settings.bgOpacity, pFont = settings.fontSize, pBgSize = settings.backgroundSize || 'cover';
  const bgInput = $('#bgInput'), bgPreview = $('#bgPreview'), bgOpInput = $('#bgOpacityInput'), bgOpVal = $('#bgOpacityValue'), fontInput = $('#fontSizeInput'), fontVal = $('#fontSizeValue'), bgSizeInput = $('#bgSizeInput');

  function applyPreview() {
    document.documentElement.setAttribute('data-theme', pTheme);
    document.documentElement.style.setProperty('--font-size', pFont + 'px');
    document.documentElement.style.setProperty('--bg-opacity', pBgOp);
    if (pBg) { bgImageEl.style.backgroundImage = `url('${pBg}')`; bgImageEl.style.opacity = pBgOp; bgImageEl.classList.add('active'); }
    else { bgImageEl.style.backgroundImage = ''; bgImageEl.style.opacity = 0; bgImageEl.classList.remove('active'); }
    applyBgFit(bgImageEl, pBgSize);
    if (pBg) applyBgFit(bgPreview, pBgSize);
    else { bgPreview.style.backgroundSize = ''; bgPreview.style.backgroundRepeat = ''; bgPreview.style.backgroundPosition = ''; }
    if (editor) { updateMonacoTheme(); editor.updateOptions({ fontSize: pFont, lineHeight: Math.round(pFont * 1.6) }); }
  }

  bgInput.addEventListener('input', () => { pBg = bgInput.value.trim(); bgPreview.style.backgroundImage = pBg ? `url('${pBg}')` : ''; bgPreview.innerHTML = pBg ? '' : '<span>No background set</span>'; applyPreview(); });
  bgOpInput.addEventListener('input', () => { pBgOp = bgOpInput.value / 100; bgOpVal.textContent = bgOpInput.value + '%'; applyPreview(); });
  fontInput.addEventListener('input', () => { pFont = parseInt(fontInput.value); fontVal.textContent = pFont + 'px'; applyPreview(); });
  bgSizeInput.addEventListener('change', () => { pBgSize = bgSizeInput.value; applyPreview(); });
  $$('.theme-btn').forEach(btn => btn.addEventListener('click', () => { $$('.theme-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); pTheme = btn.dataset.theme; applyPreview(); }));
  $('#cancelBtn').addEventListener('click', () => { applySettings(); closeSettings(); });
  $('#saveBtn').addEventListener('click', () => { settings = { theme: pTheme, background: pBg, bgOpacity: pBgOp, fontSize: pFont, backgroundSize: pBgSize }; applySettings(); saveState(); closeSettings(); showToast('Settings saved', 'success'); });
  $('#clearSettingsBtn').addEventListener('click', () => { settings = { theme: 'ocean', background: '', bgOpacity: 0.25, fontSize: 14, backgroundSize: 'cover' }; applySettings(); saveState(); closeSettings(); showToast('Settings reset', 'success'); setTimeout(() => openSettings(), 150); });
  $('#modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') { applySettings(); closeSettings(); } });
  if (focusField === 'background') setTimeout(() => bgInput.focus(), 100);
}

function closeSettings() { const backdrop = $('#modalBackdrop'); if (backdrop) { backdrop.classList.remove('visible'); modalContainer.innerHTML = ''; } }

// Applies the chosen background fit mode (cover|stretch|fit|tile|normal)
// to a given element by setting background-size, repeat, and position.
// Inline styles are applied with "important" priority so no stylesheet
// rule (e.g. .bg-image { background-size: cover }) can override the setting.
function applyBgFit(el, key) {
  if (!el) return;
  const cfg = {
    cover:   { size: 'cover',     repeat: 'no-repeat', position: 'center' },
    stretch: { size: '100% 100%', repeat: 'no-repeat', position: 'center' },
    fit:     { size: 'contain',   repeat: 'no-repeat', position: 'center' },
    tile:    { size: 'auto',      repeat: 'repeat',    position: '0 0' },
    normal:  { size: 'auto',      repeat: 'no-repeat', position: 'center' },
  }[key] || { size: 'cover', repeat: 'no-repeat', position: 'center' };
  el.style.setProperty('background-size', cfg.size, 'important');
  el.style.setProperty('background-repeat', cfg.repeat, 'important');
  el.style.setProperty('background-position', cfg.position, 'important');
}

function applySettings() {
  document.documentElement.setAttribute('data-theme', settings.theme);
  document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
  document.documentElement.style.setProperty('--bg-opacity', settings.bgOpacity);
  if (settings.background) { bgImageEl.style.backgroundImage = `url('${settings.background}')`; bgImageEl.style.opacity = settings.bgOpacity; bgImageEl.classList.add('active'); }
  else { bgImageEl.style.backgroundImage = ''; bgImageEl.style.opacity = 0; bgImageEl.classList.remove('active'); }
  applyBgFit(bgImageEl, settings.backgroundSize);
  if (editor) { updateMonacoTheme(); editor.updateOptions({ fontSize: settings.fontSize, lineHeight: Math.round(settings.fontSize * 1.6) }); }
}

// ============================================================
// Copy / Export
// ============================================================
function copyOutput() {
  const tab = getActiveTab(); if (!tab) return;
  const sel = window.getSelection().toString();
  if (sel) { navigator.clipboard.writeText(sel).then(() => showToast('Copied selection', 'success')); return; }
  const text = tab.output.filter(l => l.type !== 'banner').map(l => {
    if (l.type === 'input') return '> ' + l.text; if (l.type === 'continue') return '>> ' + l.text; if (l.type === 'system') return '# ' + l.text; return l.text;
  }).join('\n');
  navigator.clipboard.writeText(text).then(() => showToast('Output copied to clipboard', 'success')).catch(() => showToast('Copy failed', 'error'));
}

function exportOutput() {
  const tab = getActiveTab(); if (!tab) return;
  const text = tab.output.filter(l => l.type !== 'banner').map(l => {
    if (l.type === 'input') return '> ' + l.text; if (l.type === 'continue') return '>> ' + l.text; if (l.type === 'system') return '# ' + l.text; return l.text;
  }).join('\n');
  const header = `-- Lua REPL Session Export\n-- Tab: ${tab.name}\n-- Date: ${new Date().toISOString()}\n\n`;
  const blob = new Blob([header + text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `lua-session-${tab.id}-${Date.now()}.txt`; a.click(); URL.revokeObjectURL(url);
  showToast('Session exported', 'success');
}

function showToast(message, type = 'info') {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const toast = document.createElement('div'); toast.className = 'toast ' + type;
  const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
  toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + escapeHtml(message);
  document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000);
}

// ============================================================
// Initialization
// ============================================================
function init() {
  setupMonaco();
  const saved = loadState();
  if (saved) {
    settings = { ...settings, ...(saved.settings || {}) };
    nextTabId = saved.nextTabId || 1;
    if (saved.tabs && saved.tabs.length > 0) {
      for (const t of saved.tabs) {
        const tab = new LuaTab(t.id, t.name, t.output || [], t.history || [], t.editorContent || '');
        tab.isNew = false; tabs.push(tab);
      }
      activeTabId = saved.activeTabId || tabs[0].id;
      const active = getActiveTab();
      if (active) {
        active.output.push({ text: '── Session restored · ' + new Date().toLocaleString() + ' ──', type: 'system' });
        editor.setValue(active.editorContent || '');
      }
    } else { newTab(); }
  } else { newTab(); }
  applySettings();
  renderTabs(); renderOutput(); updateStatus();
  editor.focus();
}

function waitForFengari(timeout = 10000) {
  return new Promise((resolve, reject) => {
    if (window.fengari) return resolve();
    const start = Date.now();
    const interval = setInterval(() => {
      if (window.fengari) { clearInterval(interval); resolve(); }
      else if (Date.now() - start > timeout) { clearInterval(interval); reject(new Error('Fengari load timeout')); }
    }, 50);
  });
}

function loadMonaco() {
  return new Promise((resolve, reject) => {
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], () => resolve(), (err) => reject(err));
  });
}

Promise.all([waitForFengari(), loadMonaco()]).then(() => {
  try { resolveFengariAPI(); }
  catch (e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-family:var(--font-ui);text-align:center;padding:20px;max-width:400px"><div style="font-size:18px;margin-bottom:8px;font-weight:600">Failed to resolve Fengari API</div><div style="font-size:13px;opacity:0.7">${escapeHtml(e.message || String(e))}</div></div>`;
    return;
  }

  try { const L = FAPI.newstate(); FAPI.openlibs(L); FAPI.close(L); }
  catch (e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-family:var(--font-ui);text-align:center;padding:20px;max-width:400px"><div style="font-size:18px;margin-bottom:8px;font-weight:600">Failed to initialize Lua runtime</div><div style="font-size:13px;opacity:0.7">${escapeHtml(e.message || String(e))}</div></div>`;
    return;
  }

  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').style.display = 'flex';
    init();
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 450);
  }, 350);
}).catch((err) => {
  document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-family:var(--font-ui);text-align:center;padding:20px;max-width:400px"><div style="font-size:18px;margin-bottom:8px;font-weight:600">Failed to load dependencies</div><div style="font-size:13px;opacity:0.7">Please check your internet connection and reload.<br>${escapeHtml(err.message || '')}</div></div>`;
});

 $('#newTabBtn').addEventListener('click', () => newTab());
 $('#settingsBtn').addEventListener('click', () => openSettings());

// Fix for text selection loss: Prevent focusing the editor if the user is selecting text in the terminal
document.addEventListener('click', (e) => {
  if (e.target.closest('.context-menu') || e.target.closest('.modal') || e.target.closest('button') || e.target.closest('.tab')) return;
  
  // If the user has text selected in the terminal, don't steal focus!
  const selection = window.getSelection().toString();
  if (selection && selection.length > 0 && terminalEl.contains(e.target)) return;

  if (e.target.closest('.terminal') || e.target.closest('.input-bar') || e.target.closest('.status-bar')) {
    if (editor) editor.focus();
  }
});
document.addEventListener('dragstart', (e) => e.preventDefault());
</script>
